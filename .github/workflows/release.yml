name: Release ppocrv3 Plugin APK

# 打 v* tag（如 v1.0.0）推送即自动发版；也可手动触发（手填版本名）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '发版版本名（如 1.0.0，仅手动触发时生效）'
        required: true
        default: '1.0.0'

permissions:
  contents: write          # 创建 GitHub Release 需要写权限

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17（AGP 8.2 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装编译平台与 build-tools（含 apksigner/zipalign）
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 配置 Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 配置 Python 与 paddlelite（用于把模型转成 .nb）
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install paddlelite

      - name: 下载 Paddle Lite 预测库（jar + jni so）
        run: bash scripts/download_deps.sh

      - name: 下载 PP-OCRv3 模型并转成 .nb
        run: bash scripts/download_models.sh

      - name: 写入 local.properties（指向 Android SDK）
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 编译 release APK（不签名，后续用 apksigner 自签）
        run: |
          if [ -n "$GITHUB_REF_NAME" ]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="${{ github.event.inputs.version }}"
          fi
          gradle assembleRelease -Pvname="1.1.5" -Pvcode="115"$TAG" | tr -d .)"

      - name: 准备签名 keystore（必须 Secrets 注入，缺失则报错）
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::未配置仓库 Secrets KEYSTORE_BASE64，无法签名发版。请在 Settings→Secrets 中配置。"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          echo "已使用仓库 Secrets 中的 keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: 对齐并签名 APK
        run: |
          cd app/build/outputs/apk/release
          UNSIGNED=$(ls app-release-unsigned.apk 2>/dev/null || ls *.apk | head -n1)
          KP="${KEYSTORE_PASSWORD:-android}"
          ALIAS="${KEY_ALIAS:-ppocrv3}"
          KPASS="${KEY_PASSWORD:-android}"
          $ANDROID_HOME/build-tools/34.0.0/zipalign -p 4 "$UNSIGNED" aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks "$GITHUB_WORKSPACE/release.keystore" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KP" --key-pass "pass:$KPASS" \
            --out ppocrv3-plugin.apk aligned.apk
          ls -lh ppocrv3-plugin.apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 生成 Release 说明（含包名/调用示例/SHA256）
        run: |
          if [ -n "$GITHUB_REF_NAME" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${{ github.event.inputs.version }}"
          fi
          SHA=$(sha256sum app/build/outputs/apk/release/ppocrv3-plugin.apk | awk '{print $1}')
          printf '# PP-OCRv3 插件 %s\n\n包名：**com.kkx.ppocrv3**\n\n## 安装\n下载下方 `ppocrv3-plugin.apk` 安装到手机，Auto.js Pro 会自动识别插件。\n\n## Auto.js 调用\n```javascript\nvar ppOCR = $plugins.load("com.kkx.ppocrv3");\nppOCR.init(false);                       // false=标准版, true=tiny 量化版\nvar r = JSON.parse(ppOCR.ocrFile("/sdcard/test.png", 0.3));\nevents.on("exit", function () { ppOCR.exit(); });\n```\n\n## 校验\n- SHA256\n```\n%s\n```\n' "$TAG" "$SHA" > release_notes.md
          echo "--- release_notes.md ---"; cat release_notes.md

      - name: 发布到 GitHub Release（带可下载链接）
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/ppocrv3-plugin.apk
          body_path: release_notes.md
          name: PP-OCRv3 插件 ${{ github.ref_name || github.event.inputs.version }}
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
